<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V0nsen — Мои проекты</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { color: #ffffff; margin: 0; }
        .subtitle { color: #8b949e; margin-top: 5px; }
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .repo-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .repo-card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .repo-title {
            color: #58a6ff;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
        }
        .repo-title:hover { text-decoration: underline; }
        .repo-desc {
            color: #8b949e;
            font-size: 0.9em;
            margin: 10px 0 15px 0;
        }
        .repo-meta {
            font-size: 0.8em;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
        }
        .lang-badge {
            background-color: #21262d;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Привет, я V0nsen 👋</h1>
        <div class="subtitle">Мои последние проекты и публикации с GitHub</div>
    </header>

    <main>
        <div id="repos" class="repo-grid">Загрузка проектов...</div>
    </main>

    <script>
        const username = 'progame25093-dotcom';
        const reposContainer = document.getElementById('repos');

        async function fetchRepos() {
            try {
                // Запрашиваем репозитории, отсортированные по дате обновления
                const response = await fetch(`https://github.com{username}/repos?sort=updated&per_page=10`);
                const repos = await response.json();

                reposContainer.innerHTML = '';

                repos.forEach(repo => {
                    // Пропускаем сам репозиторий сайта
                    if (repo.name === `${username}.github.io`) return;

                    const card = document.createElement('div');
                    card.className = 'repo-card';

                    const date = new Date(repo.updated_at).toLocaleDateString('ru-RU');
                    const lang = repo.language ? `<span class="lang-badge">${repo.language}</span>` : '';

                    card.innerHTML = `
                        <div>
                            <a href="${repo.html_url}" target="_blank" class="repo-title">${repo.name}</a>
                            <p class="repo-desc">${repo.description || 'Описание отсутствует'}</p>
                        </div>
                        <div class="repo-meta">
                            ${lang}
                            <span>Обновлено: ${date}</span>
                        </div>
                    `;
                    reposContainer.appendChild(card);
                });

                if (reposContainer.innerHTML === '') {
                    reposContainer.innerHTML = '<p>Пока нет других публичных репозиториев.</p>';
                }
            } catch (error) {
                reposContainer.innerHTML = '<p>Ошибка при загрузке проектов.</p>';
                console.error(error);
            }
        }

        fetchRepos();
    </script>

</body>
</html>
